<svg xmlns="http://www.w3.org/2000/svg" width="680" height="712" viewBox="0 0 680 712" role="img" aria-labelledby="t2 d2" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif">
  <title id="t2">The seven triage pipeline stages</title>
  <desc id="d2">A report passes through seven ordered stages: received, redaction, classification, indicator extraction, severity scoring, related incident detection, and routing to a response team. Redaction runs first, so every later stage only ever sees redacted text.</desc>

  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8F89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="712" fill="#F7F7F4"/>

  <rect x="190" y="40" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
  <text x="340" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#141715" font-family="'Space Grotesk', system-ui, sans-serif">Received</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#8A8F89">Report arrives, nothing touched yet</text>

  <line x1="340" y1="96" x2="340" y2="126" stroke="#8A8F89" stroke-width="1.5" marker-end="url(#arrow-end)"/>

  <rect x="190" y="136" width="300" height="56" rx="8" fill="#E4F5EC" stroke="#BFE6D4" stroke-width="1"/>
  <text x="340" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#0A5F45" font-family="'Space Grotesk', system-ui, sans-serif">Redaction</text>
  <text x="340" y="178" text-anchor="middle" font-size="12" fill="#0E7C5A">Personal data removed first</text>

  <line x1="340" y1="192" x2="340" y2="222" stroke="#8A8F89" stroke-width="1.5" marker-end="url(#arrow-end)"/>

  <rect x="190" y="232" width="300" height="56" rx="8" fill="#E4F5EC" stroke="#BFE6D4" stroke-width="1"/>
  <text x="340" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#0A5F45" font-family="'Space Grotesk', system-ui, sans-serif">Classification</text>
  <text x="340" y="274" text-anchor="middle" font-size="12" fill="#0E7C5A">One of eight categories</text>

  <line x1="340" y1="288" x2="340" y2="318" stroke="#8A8F89" stroke-width="1.5" marker-end="url(#arrow-end)"/>

  <rect x="190" y="328" width="300" height="56" rx="8" fill="#E4F5EC" stroke="#BFE6D4" stroke-width="1"/>
  <text x="340" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#0A5F45" font-family="'Space Grotesk', system-ui, sans-serif">Indicator extraction</text>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#0E7C5A">URLs, IPs, hashes, systems</text>

  <line x1="340" y1="384" x2="340" y2="414" stroke="#8A8F89" stroke-width="1.5" marker-end="url(#arrow-end)"/>

  <rect x="190" y="424" width="300" height="56" rx="8" fill="#E4F5EC" stroke="#BFE6D4" stroke-width="1"/>
  <text x="340" y="449" text-anchor="middle" font-size="14" font-weight="600" fill="#0A5F45" font-family="'Space Grotesk', system-ui, sans-serif">Severity scoring</text>
  <text x="340" y="466" text-anchor="middle" font-size="12" fill="#0E7C5A">Critical, high, medium, low</text>

  <line x1="340" y1="480" x2="340" y2="510" stroke="#8A8F89" stroke-width="1.5" marker-end="url(#arrow-end)"/>

  <rect x="190" y="520" width="300" height="56" rx="8" fill="#E4F5EC" stroke="#BFE6D4" stroke-width="1"/>
  <text x="340" y="545" text-anchor="middle" font-size="14" font-weight="600" fill="#0A5F45" font-family="'Space Grotesk', system-ui, sans-serif">Related incidents</text>
  <text x="340" y="562" text-anchor="middle" font-size="12" fill="#0E7C5A">Cosine similarity over embeddings</text>

  <line x1="340" y1="576" x2="340" y2="606" stroke="#8A8F89" stroke-width="1.5" marker-end="url(#arrow-end)"/>

  <rect x="190" y="616" width="300" height="56" rx="8" fill="#E4F5EC" stroke="#BFE6D4" stroke-width="1"/>
  <text x="340" y="641" text-anchor="middle" font-size="14" font-weight="600" fill="#0A5F45" font-family="'Space Grotesk', system-ui, sans-serif">Routing</text>
  <text x="340" y="658" text-anchor="middle" font-size="12" fill="#0E7C5A">Assigned to a response team</text>
</svg>
